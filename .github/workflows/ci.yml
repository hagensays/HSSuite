name: CI

on:
  pull_request:
    branches: [ main ]

permissions:
  contents: read

jobs:
  template-invariants:
    name: Template invariants
    runs-on: windows-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Validate HSSuite baseline
        shell: pwsh
        run: ./tests/TemplateChecks.ps1

  build:
    name: Build .NET Framework 4.7.2
    runs-on: windows-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Setup MSBuild
        uses: microsoft/setup-msbuild@v2
      - name: Build Release
        shell: pwsh
        run: msbuild HSTemplate.sln /m /t:Rebuild /p:Configuration=Release /p:Platform="Any CPU"
      - name: Verify executable
        shell: pwsh
        run: |
          if (-not (Test-Path 'src/HSTemplate/bin/Release/HSTemplate.exe')) { throw 'Release EXE missing.' }
      - name: Upload CI build
        uses: actions/upload-artifact@v4
        with:
          name: HSTemplate-pr-build
          path: src/HSTemplate/bin/Release/HSTemplate.exe
          if-no-files-found: error
